name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Every third-party action is pinned by commit SHA. zizmor.yml requires
      # it, and the zizmor step below checks it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      # uv.lock is the one source for every tool version here, the validators
      # included. The rashid range is in pyproject.toml. stac-check is not
      # pinned there, so `uv lock --upgrade-package stac-check` takes a new
      # release. See docs/conformance.md.
      - name: Install from the lock file
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run pyflakes tools/*.py tests/*.py pipeline/src pipeline/tests

      - name: Pipeline unit tests
        run: uv run pytest

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Leave it unset locally.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: uv run python tests/run_all.py

      # The goes-virtual package is its own uv project with its own lock file.
      # Its gates are stricter than the pipeline's: ruff and mypy strict.
      - name: goes-virtual gates
        working-directory: packages/goes-virtual
        run: |
          uv sync --frozen
          uv run ruff check
          uv run ruff format --check
          uv run mypy
          uv run pytest

      - name: Audit the workflows
        run: uvx zizmor@1.31.1 --offline .github/workflows
