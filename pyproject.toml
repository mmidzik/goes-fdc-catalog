[project]
name = "goes-fdc-catalog"
version = "0.0.0"
description = "Pipeline that builds the GOES ABI FDC virtual Zarr Portolan catalog"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "goes-virtual",
    "icechunk",
    "xarray",
    "pyproj>=3.8.0",
]

[tool.uv.sources]
goes-virtual = { path = "packages/goes-virtual", editable = true }

[project.scripts]
goes-fdc = "goes_fdc.cli:main"

[dependency-groups]
dev = [
    "rashid>=0.1.8,<0.2.0",
    "stac-check",
    "pyflakes",
    "pytest",
    "rioxarray>=0.23.0",
]
examples = [
    "contextily>=1.7.1",
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pystac>=1.15.2",
    "rioxarray>=0.23.0",
]
site = [
    "pystac>=1.15.2",
    "rioxarray>=0.23.0",
]
upload = [
    "boto3>=1.43.116",
]
viz = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/src/goes_fdc"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
