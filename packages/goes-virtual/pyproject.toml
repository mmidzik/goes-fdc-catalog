[project]
name = "goes-virtual"
version = "0.1.0"
description = "Virtual Zarr cubes over NOAA GOES ABI netCDF files, in Icechunk"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "virtualizarr[hdf]>=2.8",
    "icechunk>=2.3",
    "zarr>=3.4",
    "zarr-cm>=0.5.0",
    "xarray>=2025.6.1",
    "obstore>=0.11",
    "obspec-utils>=0.9",
    "pyproj>=3.8",
    "h5netcdf>=1.8.1",
    "numpy>=2",
]

[dependency-groups]
dev = [
    "geozarr-toolkit>=0.1.2",
    "mypy>=2.4.0",
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goes_virtual"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: network access to the NOAA GOES buckets"]
addopts = "-ra --strict-markers -m 'not live'"

[tool.mypy]
files = ["src"]
strict = true
ignore_missing_imports = true  # most of the geospatial stack ships no type stubs

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "NPY", "N", "RUF"]
ignore = [
  "E501",
  "N818",   # exception names follow the domain, such as EncodingMismatch
  "SIM103", "SIM108",
]
allowed-confusables = ["×"]  # dimension products such as `y` × `x`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N", "B011"]
